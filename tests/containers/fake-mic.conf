# A mic that isn't a mic: play into fake-mic.feed, record from fake-mic.
# The loopback lives inside the PipeWire daemon, so it has no client
# and MicSnitch leaves it alone. Only the apps recording from it get asked.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "MicSnitch test mic"
      capture.props = {
        node.name = "fake-mic.feed"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "fake-mic"
        media.class = "Audio/Source"
        audio.position = [ FL FR ]
      }
    }
  }
]
